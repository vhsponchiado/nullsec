# Convenience wrapper around the Dockerfile for local runs.
#
#   docker compose up -d --build
#   open http://localhost:8081
#
# Override ports with e.g. `PROXY_PORT=9090 API_PORT=9091 docker compose up -d`
# — both the container's own listener and the host mapping follow.
#
# --- Practice target (dvwa) ----------------------------------------------
# Damn Vulnerable Web App — an intentionally exploitable practice app, run
# as a safe target for the main `nullsec` service above.
#
# One-time setup:
#   1. docker compose up -d dvwa
#   2. Open http://localhost:8888/setup.php and click "Create / Reset Database".
#   3. Log in at http://localhost:8888/login.php — admin / password.
#   4. DVWA Security (left nav) → set to "low" so the scanners have something
#      to actually find.
#   5. Point your browser (a throwaway profile) at nullsec's proxy:
#      127.0.0.1:8080.
#   6. Browse to http://dvwa/ (not localhost:8888 — from inside nullsec's
#      container, "dvwa" is the reachable name; the compose network
#      resolves it) and attack away with Intruder/SQLi/XSS/Spider. Everything
#      lands in nullsec's normal Proxy History at http://localhost:8081.
services:
  nullsec:
    build: .
    image: nullsec:local
    environment:
      PROXY_PORT: ${PROXY_PORT:-8080}
      API_PORT: ${API_PORT:-8081}
      # DB_PATH / CA_CERT_PATH / CA_KEY_PATH default to /data/... (see
      # Dockerfile) — the nullsec-data volume below is what makes that
      # survive `docker compose down`/`up` instead of regenerating an empty
      # history and a new (untrusted) CA every time. Only override these if
      # you want them somewhere other than /data.
    ports:
      - "${PROXY_PORT:-8080}:${PROXY_PORT:-8080}"
      - "${API_PORT:-8081}:${API_PORT:-8081}"
    volumes:
      - nullsec-data:/data
    restart: unless-stopped

  # Damn Vulnerable Web App — an all-in-one image (Apache+PHP+MySQL bundled
  # together, no separate DB service needed) purpose-built as an attack
  # target for learning/practicing. Only ever point nullsec at this, never
  # a real target, while getting familiar with a new attack.
  #dvwa:
    #image: vulnerables/web-dvwa
    #ports:
      #- "8888:80"
    #restart: unless-stopped

volumes:
  nullsec-data:

run:
  timeout: 5m

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - staticcheck
    - unused
    - errcheck
    - ineffassign
    - gosec
    - bodyclose
    - unconvert
    - misspell
    - revive

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true # doc comments are encouraged, not yet enforced on every exported symbol

issues:
  exclude-rules:
    # Generated file; never hand-edited, not worth linting.
    - path: internal/portscan/topports_gen\.go
      linters:
        - gofmt
        - goimports
        - staticcheck
        - unused
        - revive

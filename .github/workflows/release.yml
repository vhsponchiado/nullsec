name: Release

# Builds nullsec-server for every supported OS/arch and attaches the
# binaries (plus a checksums.txt) to a GitHub Release. Push a tag like
# `v0.1.0` to run it for real; workflow_dispatch lets you test the build
# without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: backend

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Build nullsec-server (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="nullsec-server-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          version="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$out" ./cmd/server

      - uses: actions/upload-artifact@v4
        with:
          name: nullsec-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: backend/nullsec-server-*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
